<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Page not found | الصفحة غير موجودة - Nexora</title>
    <meta name="robots" content="noindex,follow">
    <meta name="author" content="Mohamed Hamra | محمد حمرة">
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/Nexora-docs/assets/style.css">
    <style>
      .nf {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .nf h1 {
        font-size: 96px;
        margin: 0;
        line-height: 1;
        color: var(--acc,#4f46e5);
      }

      .nf .box {
        max-width: 560px;
      }

      .nf p {
        color: var(--mut);
      }

      .nf .btns {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin: 18px 0;
      }

      .nf .btns a {
        padding: 10px 18px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        font-weight: 600;
        text-decoration: none;
      }

      .nf .ar {
        direction: rtl;
        font-family: "Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
        margin-top: 20px;
      }

      .nf small {
        display: block;
        margin-top: 28px;
        color: var(--mut);
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <div class="box">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you are looking for does not exist or has been moved.</p>
        <div class="ar" lang="ar" dir="rtl">
          <h2>الصفحة غير موجودة</h2>
          <p>الصفحة التي تبحث عنها غير موجودة أو تم نقلها.</p>
        </div>
        <div class="btns"><a href="/Nexora-docs/index.html">Documentation Home</a><a href="/Nexora-docs/quickstart.html">Quickstart</a><a href="/Nexora-docs/ar/index.html" lang="ar">التوثيق بالعربية</a></div>
        <small>Mohamed Hamra · محمد حمرة &middot; <a href="https://github.com/mhamad-code" rel="author noopener">GitHub</a></small>
      </div>
    </main>
    <script>
      var isArabic = /^\/Nexora-docs\/ar\//.test(location.pathname) || (navigator.language || '').indexOf('ar') === 0;
      if (isArabic) {
        document.title = 'الصفحة غير موجودة (404) - Nexora';
      }
    </script>
  </body>
</html>
